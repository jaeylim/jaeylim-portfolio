apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: zammad-postgresql
  name: zammad-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: zammad-postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: zammad-postgresql
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: zammad_production
            - name: POSTGRES_PASSWORD
              value: zammad
            - name: POSTGRES_USER
              value: zammad
          image: postgres:17.10-alpine
          livenessProbe:
            exec:
              command:
                - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
            failureThreshold: 5
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          name: zammad-postgresql
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgresql-data
      restartPolicy: Always
      volumes:
        - name: postgresql-data
          persistentVolumeClaim:
            claimName: postgresql-data
